name: render-video

on:
  workflow_dispatch:
    inputs:
      story_b64:
        description: "Base64 encoded story.json"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts

      - name: Write story.json
        env:
          STORY_B64: ${{ inputs.story_b64 }}
        run: echo "$STORY_B64" | base64 -d > story.json

      - name: Render
        run: python render.py

      - name: Publish video as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: video-${{ github.run_id }}
          files: final.mp4
